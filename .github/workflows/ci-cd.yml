name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-push:
    name: Build, Test, and Push
    runs-on: self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      REGISTRY_PORT: "31482"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit Tests
        run: |
          pip install pytest pytest-cov
          pytest tests -v --cov=scripts --cov-report=term-missing --cov-fail-under=85

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=registry.withershins.local:31482/moby/buildkit:buildx-stable-1
            network=host
          buildkitd-config-inline: |
            [registry."registry.withershins.local:31482"]
              insecure = true

      - name: Build and Push Image
        if: success() && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          network: host
          platforms: linux/amd64
          push: true
          tags: |
            registry.withershins.local:${{ env.REGISTRY_PORT }}/withershins-db-backup:latest
            registry.withershins.local:${{ env.REGISTRY_PORT }}/withershins-db-backup:${{ github.run_id }}